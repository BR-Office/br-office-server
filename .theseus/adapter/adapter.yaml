# Theseus adapter for the Euro-Office server fork, pilot v2 (restarted from upstream). See .theseus/spec/adapter.md.
# Pilot: Claude models only, so review.allow_same_family is on (rule R4 exception).

project:
  name: euro-office-server
  description: Euro-Office Document Server backend (Node.js) — fork used as the first Theseus pilot
  repository: github.com/BR-Office/br-office-server
  upstream:
    repository: github.com/Euro-Office/server
    branch: main
    sync_every: 7d

goals:
  # Rafael, 2026-11-02: the reason for the work is performance, in quality and speed,
  # wherever users feel it (server or client). No weights.
  statement: >
    Gain performance in quality (fewer defects, crashes and regressions) and in speed
    (latency and throughput of what users do), wherever users feel it: in the server
    or in the client. Change of language, partial or total, where it delivers that gain.
  measure:
    - "Speed: latency and throughput of what users do (open, co-edit, save, convert), on the server or in the client"
    - "Quality: defects, crashes and regressions, and what in the code makes them likely"
  preferred_languages: [rust, go, typescript]
  # Rafael (2026-11-02, explicit): agents get every privilege they need in this disposable VM;
  # without it the VM cannot run the stack to measure. Measurement packets only.
  baseline_commands: ["*"]        # every privilege for measurement packets (Theseus 0.13.4)
  # Rafael, 2026-11-03 (TEP-0013): optimize the whole application by what users do, end to end,
  # measured against the integrated build (main branch + the forks' theseus branches).
  journeys:
    # Rafael, 2026-11-03: a real document that took more than 20 s to open the first time in
    # his own Euro-Office installation (11 pages, 2.8 MB, 11 images, 9 tables, CJK fonts).
    - id: open-docx-real
      description: "Select .theseus/oracle/journeys/samples/aluno-moderno.docx (a real 11-page document with images, tables and CJK fonts) and wait until it is fully rendered in the browser, first open with a cold browser cache"
      measure: bash .theseus/oracle/journeys/open-docx-real.sh
    - id: open-docx-10p
      description: "Select a 10-page Word document and wait until it is fully rendered in the browser (first open)"
      measure: bash .theseus/oracle/journeys/open-docx-10p.sh
    - id: open-docx-100p
      description: "Select a 100-page Word document and wait until it is fully rendered in the browser (first open)"
      measure: bash .theseus/oracle/journeys/open-docx-100p.sh
    - id: typing
      description: "Type in an open Word document: key press to the character drawn on screen"
      measure: bash .theseus/oracle/journeys/typing.sh
    - id: coedit-remote
      description: "Two users in the same Word document: a change by one until it is drawn on the other's screen"
      measure: bash .theseus/oracle/journeys/coedit-remote.sh
    - id: save
      description: "Close an edited Word document until the saved file is available"
      measure: bash .theseus/oracle/journeys/save.sh
    - id: convert-docx-pdf
      description: "Convert a Word document to PDF through the server until the PDF is returned"
      measure: bash .theseus/oracle/journeys/convert-docx-pdf.sh

modules:
  - id: common
    path: Common
    description: "Shared library used by every service (utilities, configuration, storage, queues, tenants)."
  - id: docservice
    path: DocService
    description: "Document coordination server (co-editing, conversion requests, WOPI)."
  # Rafael, 2026-11-02: the measured user-visible time is in the client and in x2t, so they
  # join the pilot. Their packets change the code through the BR-Office forks (Theseus 0.18.0).
  - id: x2t
    repository: https://github.com/Euro-Office/core
    fork: https://github.com/BR-Office/br-office-core
    path: external/core/X2tConverter
    description: "The C++ document converter (x2t). 70-90% of every PDF conversion and the document conversion inside open; PDF export goes through PdfFile, DocxRenderer and DesktopEditor graphics in the same repository."
  - id: sdkjs-word
    repository: https://github.com/Euro-Office/sdkjs
    fork: https://github.com/BR-Office/br-office-sdkjs
    path: external/sdkjs/word
    oracle: ["bash .theseus/oracle/sdkjs-word.sh"]
    description: "The document editor's model and layout in the browser. After Editor.bin arrives, 1.5-2.4 s of parse, layout and first render on open; applying remote co-edit changes (p90 105-187 ms)."
  - id: sdkjs-common
    repository: https://github.com/Euro-Office/sdkjs
    fork: https://github.com/BR-Office/br-office-sdkjs
    path: external/sdkjs/common
    oracle: ["bash .theseus/oracle/sdkjs-common.sh"]
    description: "Shared browser engine of the editors (fonts, drawing, serialization, co-editing client). 14-25 font files per open."
  - id: web-apps-documenteditor
    repository: https://github.com/Euro-Office/web-apps
    fork: https://github.com/BR-Office/br-office-web-apps
    path: external/web-apps/apps/documenteditor
    oracle: ["bash .theseus/oracle/documenteditor-open.sh"]
    description: "The document editor application shell: what loads before the document (about 1.5 s of scripts and ~500 KB per open)."

  # Rafael, 2026-11-03: finish one application first, the document editor (server, converter,
  # sdkjs word and common, web-apps documenteditor). Spreadsheets (sdkjs-cell, where round 2 found
  # the largest client cost left), presentations and PDF join after it.

languages:
  present: [javascript, cpp]
  allowed_targets: any           # Rafael: any language the diagnosis justifies; preferably goals.preferred_languages

tools:
  hotspot:
    high: "cpu_pct >= 5 or (churn_90d >= 30 and coverage < 0.5)"
    medium: "cpu_pct >= 1 or churn_90d >= 10"

build:
  install: npm ci && npm ci --prefix ./Common && npm ci --prefix ./DocService && npm ci --prefix ./FileConverter
  test: .theseus/oracle/unit.sh
  lint: npm run lint:check

factory:
  # Fresh worktrees have no node_modules: install before the executor starts (about 70 s).
  setup: npm ci --no-audit --no-fund && npm ci --prefix ./Common --no-audit --no-fund && npm ci --prefix ./DocService --no-audit --no-fund && npm ci --prefix ./FileConverter --no-audit --no-fund
  # Rafael (2026-11-02): every privilege for every executor in this disposable VM ("libera todos
  # privilégios para os agentes"). Scope (R2), acceptance and review still apply.
  read_only_commands: ["*"]
  integrate: true                 # merge each approved branch into theseus-v2
  union_merge: [.gitignore, .prettierignore]
  integrate_check: .theseus/oracle/unit.sh && npm run lint:check   # every oracle command packets use

oracle:
  type: tests
  tests: [tests/unit]
  description: .theseus/adapter/oracle.md
  commands:
    unit: .theseus/oracle/unit.sh
    lint: npm run lint:check
  tolerances:
    max_benchmark_regression_pct: 0

models:
  # Rafael, 2026-11-02: Opus with low effort for every role, with the Fable advisor; no Sonnet or Haiku.
  - id: claude-opus-5-5
    family: anthropic
    tool: claude-code
    args: ["--settings", '{"advisorModel": "fable"}']
    context_window: 200000
    roles: [cartographer, diagnostician, executor, reviewer, auditor]
  # A second, independent Opus session, so a packet is never reviewed by the session that executed it.
  - id: claude-opus-5-5-b
    family: anthropic
    tool: claude-code
    model_name: claude-opus-5-5
    args: ["--settings", '{"advisorModel": "fable"}']
    context_window: 200000
    roles: [diagnostician, executor, reviewer]

environment:
  checks:                         # TEP-0002: packets list the ones they need in `requires`
    documentserver: curl -sf http://127.0.0.1/healthcheck
    browser: node -e "require('playwright')"
  start:                          # run once when a check fails, then the check runs again
    documentserver: .theseus/adapter/scripts/start-documentserver.sh

review:
  allow_same_family: true         # pilot: only Claude models; turn off when Codex joins

routing:
  mode: auto
  min_samples: 5
  explore: 0.15

effort:
  levels: [low]                   # Rafael, 2026-11-02: low for everything
  default: low
  planning: low
  by_type: {}

initial_routing:
  investigate: [claude-opus-5-5]
  characterize: [claude-opus-5-5]
  refactor: [claude-opus-5-5]
  migrate: [claude-opus-5-5]
  interop: [claude-opus-5-5]

limits:
  max_context_ratio: 0.40
  abandon_after_hours: 2
  max_cost_per_packet_usd: 5.00
  stale_card_ratio: 0.10
  max_parallel_agents: 2
  agent_timeout_min: 90          # measurements with the full stack (load tests) need more than 30 min

audit:
  every_n_packets: 20
  alarms:
    - "high_severity_escapes_7d > 2"
    - "first_review_approval_30d < 0.5"

shared_telemetry: false
